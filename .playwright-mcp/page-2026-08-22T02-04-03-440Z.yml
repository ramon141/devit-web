            - generic [ref=f1e167]:
              - heading "Descrizione" [level=2] [ref=f1e169]
              - generic [ref=f1e170]:
                - paragraph [ref=f1e171]: Massa Lubrense (Na), a pochi metri dal confine del Comune di Sorrento e nella prestigiosa area residenziale del Parco Letizia, la Devit vende panoramica villa con ampi spazi esterni di proprieta’ esclusiva. La dimora, in posizione invidiabile all’interno di un parco composto da sole 20 ville, offre allo stesso tempo la comodità dei principali servizi del centro abitato di Massa ad 1 km di distanza e la vicinanza del meraviglioso mare di Marina di Puolo a soli 1,5 km.. La villa offre un’atmosfera intima e riservata, grazie ai propri spazi esterni e alla splendida area verde comune di ben 30.000 mq. di uliveti che la circonda, garantendo la massima privacy ed ideale per passeggiare e rilassarsi tra la natura e gli impareggiabili panorami sorrentini oppure rinfrescarsi nelle 2 piscine sorvegliate o divertirsi al campo di calcetto, strutture a disposizione dei proprietari ed i loro ospiti. La villa, pensata per essere vissuta sia internamente che negli ampi spazi esterni è composta da un salone all’ingresso, una cucina, 3 camere da letto, 2 servizi. Completa la soluzione immobiliare un posto auto di proprietà oltre posti auto liberi nelle zone di parcheggio comuni.
