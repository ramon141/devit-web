server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/nginx-security-headers.inc;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # Página inicial e rotas do app: sempre revalida, para nunca servir versão antiga
    location / {
        try_files $uri $uri/index.html /index.html;
        include /etc/nginx/conf.d/nginx-security-headers.inc;
        add_header Cache-Control "no-cache";
    }

    # Arquivos com hash no nome: nunca mudam
    location /assets/ {
        include /etc/nginx/conf.d/nginx-security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Imagens, vídeos e fontes fora de /assets (sem hash): cache longo com revalidação
    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|mp4|webm|woff2?)$ {
        include /etc/nginx/conf.d/nginx-security-headers.inc;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Landing estática "Vendi con noi"
    location ~* ^/vendi-con-noi/.*\.(?:js|css)$ {
        include /etc/nginx/conf.d/nginx-security-headers.inc;
        add_header Cache-Control "no-cache";
    }
}
